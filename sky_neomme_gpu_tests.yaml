# Ephemeral H100 box for the NeoMME GPU-only tests (flash-attention equivalence, fp16/bf16 paths).
#
# Those tests are collected by ModelTesterMixin but skip on CPU, so the flash-attention path — where our
# sliding_window half-width has to line up with FA's inclusive band — is otherwise never exercised.
#
#   sky launch -c neomme-gpu sky_neomme_gpu_tests.yaml --env HF_TOKEN="$HF_TOKEN"
#   sky exec   neomme-gpu    sky_neomme_gpu_tests.yaml --env HF_TOKEN="$HF_TOKEN" --env CMD='...'
#   sky down   neomme-gpu
#
# `sky exec <cluster> <bare command>` does NOT upload local edits; going through this YAML does, because of
# `workdir: .`. Autodown is 60m, so a forgotten cluster bills an hour rather than a weekend.
name: neomme-gpu-tests

workdir: .

resources:
  infra: kubernetes
  # devel image: the flash-attention wheel links against CUDA and wants nvcc present.
  image_id: docker:nvidia/cuda:12.9.2-cudnn-devel-ubuntu24.04
  accelerators: H100:1
  cpus: 8+
  disk_size: 128GB

envs:
  # The point of the cluster: the flash-attention and sdpa paths that skip on CPU.
  CMD: "RUN_SLOW=1 pytest tests/models/neomme/ -p no:randomly -k 'flash or sdpa' -v"
  HF_TOKEN: ""

setup: |
  set -e
  command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"

  # Triton JIT-compiles a CUDA shim against the system Python headers, so torch.compile tests fail with
  # "Python.h: No such file or directory" on the bare CUDA image.
  apt-get update -qq && apt-get install -y -qq python3-dev >/dev/null

  cd ~/sky_workdir
  [ -d .venv ] || uv venv --python 3.12 .venv
  VIRTUAL_ENV=.venv uv pip install -q \
    torch==2.8.0 --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cu128
  # Prebuilt wheel, matching the pin in the research repo's pyproject: building from source costs ~10 minutes.
  VIRTUAL_ENV=.venv uv pip install -q \
    "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1+cu12torch2.8cxx11abiFALSE-cp312-cp312-linux_x86_64.whl"
  VIRTUAL_ENV=.venv uv pip install -q \
    "tokenizers>=0.22.0,<=0.23.0" pillow numpy pytest pytest-xdist pytest-subtests parameterized safetensors \
    "huggingface_hub>=0.34" accelerate datasets regex requests tqdm filelock pyyaml packaging
  VIRTUAL_ENV=.venv uv pip install -q -e . --no-deps

  .venv/bin/python - <<'EOF'
  import flash_attn, torch, transformers
  print("torch", torch.__version__, "| cuda", torch.cuda.is_available(), torch.cuda.get_device_name(0))
  print("flash_attn", flash_attn.__version__, "| transformers", transformers.__version__)
  EOF

run: |
  set -e
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir
  source .venv/bin/activate

  # A 401 here must not kill the job: the public tests still run without Hub access.
  set +e
  if [ -n "$HF_TOKEN" ]; then
    python -c "from huggingface_hub import login; login('$HF_TOKEN')"
    echo "HF_TOKEN len=${#HF_TOKEN}"
  else
    echo "no HF_TOKEN: private-checkpoint tests will skip or fail"
  fi
  set -e

  nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  eval "$CMD"
